<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Senior Citizen Card PVC - 1200 DPI</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;padding:20px;color:#172033}.wrap{max-width:900px;margin:auto}.card{background:#fff;padding:20px;border-radius:14px;border:1px solid #d9e1ea}.btn{padding:12px 18px;border:0;border-radius:8px;font-weight:700;background:#0b4a8b;color:white;cursor:pointer}.preview{margin-top:20px}canvas{max-width:100%;height:auto;border:1px solid #ccd5df}.note{font-size:13px;color:#667085;line-height:1.5}</style></head><body><div class="wrap"><div class="card"><h1>Senior Citizen Card → PVC</h1><p>Exact ID-1 card output at 1200-DPI-equivalent resolution.</p><input id="f" type="file" accept="image/*"><br><button class="btn" id="go">Prepare PVC</button> <button class="btn" id="dl" disabled>Download PNG</button><p id="s"></p><p class="note">Output: 85.60 × 53.98 mm. Canvas: 4047 × 2550 px. The image is resized without intentionally changing document information. Use only genuine documents.</p></div><div class="preview"><canvas id="c" width="4047" height="2550"></canvas></div></div><script>let im=null,blob=null;const f=document.getElementById('f'),c=document.getElementById('c'),x=c.getContext('2d');f.onchange=()=>{im=new Image();im.onload=()=>document.getElementById('s').textContent='Loaded '+im.naturalWidth+' × '+im.naturalHeight+' px';im.src=URL.createObjectURL(f.files[0])};document.getElementById('go').onclick=()=>{if(!im)return;const W=4047,H=2550;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';const scale=Math.min(W/im.naturalWidth,H/im.naturalHeight),w=im.naturalWidth*scale,h=im.naturalHeight*scale;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);c.toBlob(b=>{blob=b;document.getElementById('dl').disabled=false;document.getElementById('s').textContent='Ready: 4047 × 2550 px.'},'image/png')};document.getElementById('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Senior_Citizen_Card_PVC_1200DPI.png';a.click()};</script></body></html>
