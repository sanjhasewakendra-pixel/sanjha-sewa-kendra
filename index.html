<h2 style="

margin:30px 0 20px;">
📢 Today's Status
</h2>

<div id="officeStatus"
style="
max-width:550px;
margin:auto;
padding:18px;
background:#d4edda;
border-left:8px solid green;
border-radius:8px;
font-size:22px;
font-weight:bold;
text-align:center;
">

🟢 OFFICE OPEN

</div>

</div>

<script>

function updateClock(){

const now=new Date();

document.getElementById("liveDate").innerHTML=
"📅 "+now.toLocaleDateString("en-IN",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

document.getElementById("liveTime").innerHTML=
"🕒 "+now.toLocaleTimeString("en-IN");

const hour=now.getHours();
const minute=now.getMinutes();

const current=hour*60+minute;

const open=9*60;
const close=18*60;

const box=document.getElementById("officeStatus");

if(current>=open && current<close){

box.innerHTML="🟢 OFFICE OPEN";
box.style.background="#d4edda";
box.style.color="#155724";
box.style.borderLeft="8px solid green";

}else{

box.innerHTML="🔴 OFFICE CLOSED";
box.style.background="#f8d7da";
box.style.color="#721c24";
box.style.borderLeft="8px solid red";

}

}

updateClock();
setInterval(updateClock,1000);

</script>
