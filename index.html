<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sanjha Sewa Kendra Bhawanigarh</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f2f4f7;
}

.container{
width:95%;
max-width:1100px;
margin:25px auto;
background:#ffffff;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 18px rgba(0,0,0,.15);
}

/* HEADER */

.header{
background:#0056b3;
color:#ffffff;
text-align:center;
padding:30px 20px;
}

.header h1{
font-size:38px;
margin-bottom:10px;
}

.header p{
font-size:18px;
margin:8px 0;
}

.warning{
color:#FFD700;
font-size:18px;
font-weight:bold;
}

/* OFFICE IMAGE */

.banner{
padding:20px;
background:#f8f8f8;
text-align:center;
}

.banner img{
width:100%;
max-width:1000px;
height:auto;
border-radius:12px;
box-shadow:0 4px 12px rgba(0,0,0,.25);
}

/* STAFF LOGIN */

.login{
padding:25px;
text-align:center;
}

.login a{
display:inline-block;
background:#0056b3;
color:#ffffff;
padding:15px 35px;
text-decoration:none;
font-size:18px;
font-weight:bold;
border-radius:8px;
transition:.3s;
}

.login a:hover{
background:#003d80;
}

@media(max-width:768px){

.header h1{
font-size:28px;
}

.header p{
font-size:16px;
}

.login a{
width:90%;
}

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<h1>SANJHA SEWA KENDRA BHAWANIGARH</h1>

<p>Your One Stop Digital Service Centre</p>

<p class="warning">
⚠ NO OTHER BRANCH | BEWARE OF FRAUDSTERS
</p>

</div>

<!-- OFFICE IMAGE -->

<div class="banner">

<img src="office.jpg" alt="Sanjha Sewa Kendra Bhawanigarh">

</div>

<!-- STAFF LOGIN -->

<div class="login">

<a href="https://sites.google.com/view/sskbhawanigarh/home" target="_blank">

🔐 STAFF LOGIN

</a>

</div>
