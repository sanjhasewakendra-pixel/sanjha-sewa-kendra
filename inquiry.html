<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Customer Inquiry | Sanjha Sewa Kendra Bhawanigarh</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1d2939}.wrap{max-width:700px;margin:40px auto;padding:0 18px}.box{background:#fff;border:1px solid #dce4ee;border-radius:12px;padding:28px;box-shadow:0 4px 14px rgba(16,24,40,.08)}h1{color:#073b78;margin-top:0}.sub{color:#667085}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:7px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:7px;font-size:15px}textarea{min-height:120px;resize:vertical}button{width:100%;padding:13px;border:0;border-radius:7px;background:#073b78;color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px}button:disabled{opacity:.6}.back{display:inline-block;margin-bottom:18px;color:#073b78;text-decoration:none;font-weight:700}.token{display:none;margin:18px 0;padding:18px;text-align:center;border-radius:8px;background:#fff7df;border:2px dashed #f6c343;color:#073b78}.token small{display:block;font-size:14px;color:#667085;margin-bottom:5px}.token strong{display:block;font-size:26px;margin-top:7px}.msg{margin-top:15px;padding:12px;border-radius:7px;display:none}.success{background:#e7f6ec;color:#16733c}.error{background:#fdecec;color:#b42318}.hint{font-size:13px;color:#667085;margin-top:6px}</style></head><body><div class="wrap"><a class="back" href="/">← Back to Website</a><div class="box"><h1>Customer Inquiry</h1><p class="sub">Sanjha Sewa Kendra Bhawanigarh</p><div class="field"><label for="name">Customer Name *</label><input id="name" required></div><div class="field"><label for="mobile">Mobile Number *</label><input id="mobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></div><div class="field"><label for="service">Service Required *</label><select id="service" required><option value="">Select service</option><option>Aadhaar</option><option>PAN Card</option><option>Voter Card</option><option>Passport</option><option>Birth/Death Certificate</option><option>Income/Caste/Residence/EWS Certificate</option><option>Ayushman Card</option><option>e-Shram/Pension</option><option>Other Digital Service</option></select></div><button id="tokenBtn" type="button">🎫 Get Token Number</button><div class="hint">First get your token number, then submit your inquiry.</div><div id="tokenBox" class="token"><small>Your Token Number</small><strong id="tokenNo"></strong></div><div class="field"><label for="message">Message / Requirement</label><textarea id="message" placeholder="Write your requirement..."></textarea></div><button id="submitBtn" type="button" disabled>📩 Submit Inquiry</button><div id="msg" class="msg"></div></div></div><script>const endpoint='https://script.google.com/macros/s/AKfycbxfza1K5SyI6NWpuKK1s7tgEuclYzMWmOv7ziCwmAoJRtkBogLUW61LG0mU16yCaxJq/exec';const tokenBtn=document.getElementById('tokenBtn'),submitBtn=document.getElementById('submitBtn'),tokenBox=document.getElementById('tokenBox'),tokenNo=document.getElementById('tokenNo'),msg=document.getElementById('msg');let token='';function showMsg(text,type){msg.className='msg '+type;msg.textContent=text;msg.style.display='block'}tokenBtn.addEventListener('click',async()=>{if(!document.getElementById('name').value.trim()||!document.getElementById('mobile').value.trim()||!document.getElementById('service').value){alert('Please enter Name, Mobile Number and select Service first.');return}tokenBtn.disabled=true;tokenBtn.textContent='Generating Token...';msg.style.display='none';try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'token'})});const j=await r.json();if(!j.success||!j.token)throw new Error();token=j.token;tokenNo.textContent=token;tokenBox.style.display='block';submitBtn.disabled=false;tokenBtn.textContent='✓ Token Generated';showMsg('Token generated. Now submit your inquiry.','success')}catch(e){tokenBtn.disabled=false;tokenBtn.textContent='🎫 Get Token Number';showMsg('Token generate nahi ho sakeya. Please try again.','error')}});submitBtn.addEventListener('click',async()=>{if(!token){showMsg('Please get your token first.','error');return}const name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim(),service=document.getElementById('service').value,message=document.getElementById('message').value.trim();if(!name||!mobile||!service){alert('Please complete the required fields.');return}submitBtn.disabled=true;submitBtn.textContent='Submitting...';try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'inquiry',name,mobile,service,message,token})});const j=await r.json();if(!j.success)throw new Error();showMsg('Inquiry submitted successfully. Please keep your token: '+token,'success');submitBtn.textContent='✓ Inquiry Submitted'}catch(e){submitBtn.disabled=false;submitBtn.textContent='📩 Submit Inquiry';showMsg('Inquiry submit nahi ho saki. Please try again or call 9056000801.','error')}});</script></body></html>
